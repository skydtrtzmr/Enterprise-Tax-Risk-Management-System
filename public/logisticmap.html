<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <title>物流路线图1</title>
        <style>
            html,
            body,
            #map {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }

            .demo-title {
                position: absolute;
                top: 25px;

            }

            .zoom-display {
                position: absolute;
                top: 25px;

                z-index: 1;
                background-color: rgba(0, 0, 0, 0.7);
                color: white;
                padding: 10px 15px;
                border-radius: 5px;
                font-size: 14px;
                font-weight: bold;
                line-height: 1.5;
            }

            h1 {
                font-size: 18px;
                margin: 0;
                color: rgb(180, 180, 190);

        <!-- 隐藏高德地图API水印 -->

       display: none;

   </style>

    <body>
        <div class="demo-title">
            <!-- <h1>物流图</h1> -->
            <!-- <h3>通过热力暂时房产出售分布情况，颜色和高度体现出售量</h3> -->
        </div>

        <!-- 添加zoom显示元素 -->
        <!-- <div class="zoom-display" id="zoomDisplay">Zoom: 9<br /></div> -->

        <div id="map"></div>
        <script src="https://webapi.amap.com/maps?v=2.0&key=7a3a981f62a3909a3f219040a3d24786"></script>
        <script src="https://webapi.amap.com/loca?v=2.0.0&key=7a3a981f62a3909a3f219040a3d24786"></script>

        <script>
            var map = new AMap.Map("map", {
                zoom: 9,
                center: [119.180155, 31.103332],
                pitch: 45,
                showLabel: false,
                viewMode: "3D",
                mapStyle: "amap://styles/45311ae996a8bea0da10ad5151f72979",
            });

            var path = [
          [118.862492, 30.656303],
          [118.920521, 30.683554],
          [118.914557, 30.713576],
          [118.918783, 30.747888],
          [118.85767, 30.770768],
          [118.813147, 30.87035],
          [118.774511, 30.913706],
          [118.750936, 30.923407],
          [118.750561, 30.937749],
          [118.753729, 30.961297],
          [118.739114, 30.994169],
          [118.733619, 31.003062],
          [118.728497, 31.005145],
          [118.719846, 31.022748],
          [118.709814, 31.036921],
          [118.706058, 31.051736],
          [118.72657, 31.066756],
          [118.728118, 31.076081],
          [118.737913, 31.080846],
          [118.737822, 31.087827],
          [118.744546, 31.10457],
          [118.752329, 31.108724],
          [118.760497, 31.115672],
          [118.75974, 31.127707],
          [118.752727, 31.13757],
          [118.753256, 31.147955],
          [118.765995, 31.157897],
          [118.780761, 31.157818],
          [118.779966, 31.166175],
          [118.782832, 31.172869],
          [118.798374, 31.170968],
          [118.801925, 31.174411],
          [118.797386, 31.189166],
          [118.8021, 31.198953],
          [118.79854, 31.218539],
          [118.787782, 31.228022],
          [118.786342, 31.2428],
          [118.783957, 31.249631],
          [118.770655, 31.263434],
          [118.738582, 31.269458],
          [118.726575, 31.276297],
          [118.733073, 31.279452],
          [118.734147, 31.292577],
          [118.734205, 31.299214],
          [118.751224, 31.304615],
          [118.790445, 31.306443],
          [118.80039, 31.306291],
          [118.799003, 31.313096]
        ];

            var polyline = new AMap.Polyline({
                path: path,
                isOutline: true,
                outlineColor: "#0A6B60",
                borderWeight: 3,
                strokeColor: "#12BFAB",
                strokeOpacity: 1,
                strokeWeight: 4,
                // 折线样式还支持 'dashed'
                strokeStyle: "solid",
                // strokeStyle是dashed时有效
                strokeDasharray: [10, 5],
                lineJoin: "round",
                lineCap: "round",
                zIndex: 50,
            });
            map.add(polyline);
            // map.setFitView();

            // 获取zoom显示元素
            // var zoomDisplay = document.getElementById("zoomDisplay");

            // // 初始化显示当前zoom级别和透明度
            // zoomDisplay.innerHTML = "Zoom: " + map.getZoom();

            // // 监听地图缩放事件，实时更新zoom显示
            // map.on("zoomend", function () {
            //     var currentZoom = map.getZoom();
            //     updateDisplayValues();
            // });

            // // 也可以在viewchange事件中更新，这样在拖动地图时也会更新
            // map.on("viewchange", function () {
            //     updateDisplayValues();

            //     var z = map.getZoom();
            //     var outZ = 20;
            // });

            // 更新显示值的函数
            function updateDisplayValues() {
                var currentZoom = map.getZoom();

                zoomDisplay.innerHTML = "Zoom: " + currentZoom;
            }

            var loca = new Loca.Container({
                map,
            });

            var geo = new Loca.GeoJSONSource({
                url: "geo.json",
            });
            // 这里是记录每个坐标点的数值

            // 自定义只显示某地点标签

            // 自定义只显示某地点标签
            var locations = [
                {
                    name: "⭐ABC新能源科技有限公司",
                    lnglat: [118.967756, 31.364896],
                    priority: 1,
                },
                {
                    name: "金属制品有限公司",
                    lnglat: [118.96881, 31.367662],
                    priority: 2,
                },
                {
                    name: "哈雷星激光科技有限公司",
                    lnglat: [118.968861, 31.364325],
                    priority: 2,
                },
                {
                    name: "绿色产业园",
                    lnglat: [118.965717, 31.37062],
                    priority: 3,
                },
                {
                    name: "医疗产业园",
                    lnglat: [118.964171, 31.369735],
                    priority: 3,
                },
                // {
                //     name: "开发区政务服务中心",
                //     lnglat: [118.942484, 31.357135],
                //     priority: 4,
                // },
                {
                    name: "智能科技有限公司",
                    lnglat: [118.964366, 31.365745],
                    priority: 2,
                },

                {
                    name: "辰茂新材料科技有限公司",
                    lnglat: [118.966065, 31.367878],
                    priority: 3,
                },
                {
                    name: "生物科技有限公司",
                    lnglat: [118.965536, 31.367405],
                    priority: 2,
                },

                {
                    name: "盛凯斯新材料有限公司",
                    lnglat: [118.966065, 31.367878],
                    priority: 3,
                },

                // 可以添加更多地点
            ];

            // 存储所有标签的数组
            var textOverlaps = [];
            // 存储所有 createMarker 创建的 marker label
            var markerLabelOverlaps = [];

            // 添加自定义标签
            locations.forEach(function (location) {
                // 创建文本覆盖物，offset设置为正上方
                var textOverlap = new AMap.Text({
                    text: location.name,
                    position: location.lnglat,
                    offset: new AMap.Pixel(0, -2120), // 正上方偏移
                    style: {
                        "background-color": "rgba(0, 0, 0, 0.5)",
                        color: "white",
                        padding: "5px",
                        "border-radius": "3px",
                        "font-size": "12px",
                    },
                });
                textOverlap.setMap(map);
                textOverlaps.push({
                    text: textOverlap,
                    location: location,
                });
            });

            // 计算两点之间的距离（像素）
            function getPixelDistance(point1, point2) {
                var pixel1 = map.lngLatToContainer(point1);
                var pixel2 = map.lngLatToContainer(point2);
                var dx = pixel1.x - pixel2.x;
                var dy = pixel1.y - pixel2.y;
                return Math.sqrt(dx * dx + dy * dy);
            }

            // 定义三个关键坐标点
            var startPoint = path[0]; // 发货地（path起点）
            var targetPoint = [118.967756, 31.364896]; // 目标收货地（地图center）
            var endPoint = path[path.length - 1]; // 实际收货地（path终点）

            // 通用标记创建函数
            function createMarker(position, name, iconContent) {
                var marker = new AMap.Marker({
                    position: position,
                    content: iconContent,
                    offset: new AMap.Pixel(0, 0),
                    anchor: "bottom-center",
                    label: {
                        content: name,
                        offset: new AMap.Pixel(0, -25), // 正上方偏移
                        style: {
                            color: "#333",
                            fontSize: "14px",
                            backgroundColor: "#fff",
                            padding: "2px 5px",
                            borderRadius: "3px",
                        },
                    },
                });
                // 将 marker 的 label 也加入 markerLabelOverlaps
                markerLabelOverlaps.push({
                    marker: marker,
                    label: marker.getLabel(),
                    position: position,
                    name: name,
                });
                return marker;
            }

            createMarker(
                targetPoint,
                "<b>计划收货地</b><br/>ABC新能源科技有限公司",
                `<img src="http://localhost:3000/icons/end1.png" style="width: 20px;">
                `
            ).setMap(map);

            // 添加三个标记
            createMarker(
                startPoint,
                "<b>实际发货地</b>",
                `<img src="http://localhost:3000/icons/start1.png" style="width: 20px;">
                `
            ).setMap(map);

            function createMarker2(position, name, iconContent) {
                var marker = new AMap.Marker({
                    position: position,
                    content: iconContent,
                    offset: new AMap.Pixel(0, 0),
                    anchor: "bottom-center",
                    label: {
                        content: name,
                        offset: new AMap.Pixel(0, -25), // 正上方偏移
                        style: {
                            // color: "#333",
                            fontSize: "16px",
                            // backgroundColor: "#fff",
                            padding: "2px 5px",
                            borderRadius: "3px",
                        },
                    },
                });
                // 将 marker 的 label 也加入 markerLabelOverlaps
                markerLabelOverlaps.push({
                    marker: marker,
                    label: marker.getLabel(),
                    position: position,
                    name: name,
                });
                return marker;
            }

            createMarker2(
                endPoint,
                "<b>实际收货地</b>",
                `<img src="http://localhost:3000/icons/end2.png"  style="width: 20px;">
                `
            ).setMap(map);

            // 绘制实际收货地到目标收货地的直线
            var targetLine = new AMap.Polyline({
                path: [endPoint, targetPoint],
                strokeColor: "#FF0000",
                strokeWeight: 4,
                strokeOpacity: 1,
                strokeDasharray: [5, 5],
            });
            map.add(targetLine);

            // 计算并显示距离
            var distance = AMap.GeometryUtil.distance(
                endPoint,
                targetPoint
            ).toFixed(2);
            var distanceText = new AMap.Text({
                text: `距离：${(distance/1000).toFixed(2)}千米`,
                // text: "距离：15.6千米",
                position: [
                    (endPoint[0] + targetPoint[0]) / 2,
                    (endPoint[1] + targetPoint[1]) / 2,
                ],
                offset: new AMap.Pixel(-35, -25), // 正上方偏移，略大于其他标签
                style: {
                    color: "#FF0000",
                    fontSize: "14px",
                    fontWeight: "bold",
                    backgroundColor: "#fff",
                    padding: "2px 8px",
                    borderRadius: "4px",
                },
            });
            map.add(distanceText);

            // 智能标签显示（结合缩放级别和防重叠）
            function updateAdvancedLabels() {
                var currentZoom = map.getZoom();
                var showZoomThreshold = 14; // 显示标签的缩放级别阈值
                var minDistance = 60; // 最小像素距离

                // 只合并 locations 和 marker 标签
                var allOverlaps = [];
                textOverlaps.forEach(function (item) {
                    allOverlaps.push({
                        type: "location",
                        text: item.text,
                        position: item.location.lnglat,
                        priority: item.location.priority || 1,
                    });
                });
                markerLabelOverlaps.forEach(function (item, idx) {
                    allOverlaps.push({
                        type: "marker",
                        text:
                            item.marker.getLabel && item.marker.getLabel()
                                ? item.marker.getLabel()
                                : null,
                        position: item.position,
                        priority: 2,
                    });
                });

                // 距离标签单独控制显示
                if (currentZoom >= 10) {
                    if (distanceText && distanceText.show) distanceText.show();
                } else {
                    if (distanceText && distanceText.hide) distanceText.hide();
                }

                // 如果缩放级别小于阈值，隐藏所有标签
                if (currentZoom < showZoomThreshold) {
                    allOverlaps.forEach(function (item) {
                        if (item.text && item.text.hide) item.text.hide();
                    });
                    return;
                }

                // 根据缩放级别调整最小距离
                var zoomFactor = Math.max(
                    1,
                    (currentZoom - showZoomThreshold) * 0.5
                );
                var dynamicMinDistance = minDistance / zoomFactor;

                // 重置所有标签可见性
                allOverlaps.forEach(function (item) {
                    if (item.text && item.text.show) item.text.show();
                });

                // 按优先级排序
                var sortedOverlaps = allOverlaps.slice().sort(function (a, b) {
                    return a.priority - b.priority;
                });

                // 检查并处理重叠
                for (var i = 0; i < sortedOverlaps.length; i++) {
                    for (var j = i + 1; j < sortedOverlaps.length; j++) {
                        var distance = getPixelDistance(
                            sortedOverlaps[i].position,
                            sortedOverlaps[j].position
                        );
                        if (distance < dynamicMinDistance) {
                            if (
                                sortedOverlaps[j].priority <=
                                sortedOverlaps[i].priority
                            ) {
                                if (
                                    sortedOverlaps[j].text &&
                                    sortedOverlaps[j].text.hide
                                ) {
                                    sortedOverlaps[j].text.hide();
                                }
                            }
                        }
                    }
                }
            }

            // 监听缩放和拖动事件
            map.on("zoomend", updateAdvancedLabels);
            map.on("viewchange", updateAdvancedLabels);

            // 初始化时执行一次
            updateAdvancedLabels();

            // 创建纯文本标记
            var text = new AMap.Text({
                text: "纯文本标记",
                anchor: "center", // 设置文本标记锚点
                draggable: true,
                cursor: "pointer",
                angle: 0,
                visible: false,
                offset: [0, 0],
                style: {
                    padding: ".45rem 0.15rem",
                    "margin-bottom": "1rem",
                    "border-radius": ".25rem",
                    "background-color": "rgba(0,0,0,0.5)",
                    width: "15rem",
                    "border-width": 0,
                    "box-shadow": "0 2px 6px 0 rgba(255, 255, 255, .3)",
                    "text-align": "center",
                    "font-size": "15px",
                    color: "#fff",
                },
            });
            text.setMap(map);
        </script>
