<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>物流路线图2</title>
        <style>
            html,
            body,
            #map {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }

            .demo-title {
                position: absolute;
                top: 25px;
                left: 25px;
                z-index: 1;
            }

            .zoom-display {
                position: absolute;
                top: 25px;
                right: 25px;
                z-index: 1;
                background-color: rgba(0, 0, 0, 0.7);
                color: white;
                padding: 10px 15px;
                border-radius: 5px;
                font-size: 14px;
                font-weight: bold;
                line-height: 1.5;
                display: none;
            }

            h1 {
                font-size: 18px;
                margin: 0;
                color: rgb(180, 180, 190);
            }

            h3 {
                font-size: 12px;
                font-weight: normal;
                margin-top: 5px;
                color: rgb(150, 150, 150);
            }
        </style>
    </head>
    <!-- 隐藏高德地图API水印 -->
    <style type="text/css">
       .amap-logo{
       display: none;
       opacity:0 !important;
       }
       .amap-copyright {
           opacity:0;
       }
   </style>
    <body>
        <div class="demo-title">
            <!-- <h1>物流图</h1> -->
            <!-- <h3>通过热力暂时房产出售分布情况，颜色和高度体现出售量</h3> -->
        </div>

        <!-- 添加zoom显示元素 -->
        <div class="zoom-display" id="zoomDisplay">Zoom: 12<br /></div>

        <div id="map"></div>
        <script src="https://webapi.amap.com/maps?v=2.0&key=7a3a981f62a3909a3f219040a3d24786"></script>
        <script src="https://webapi.amap.com/loca?v=2.0.0&key=7a3a981f62a3909a3f219040a3d24786"></script>

        <script>
            var map = new AMap.Map("map", {
                zoom: 9,
                center: [119.903184, 31.642777],
                pitch: 45,
                showLabel: false,
                viewMode: "3D",
                mapStyle: "amap://styles/45311ae996a8bea0da10ad5151f72979",
            });

            var path = [
                [119.424984, 32.185119],
                [119.405954, 32.184826],
                [119.400764, 32.177505],
                [119.388181, 32.173658],
                [119.412951, 32.13686],
                [119.410948, 32.09988],
                [119.406141, 32.074086],
                [119.402618, 32.059538],
                [119.405374, 32.044224],
                [119.408713, 32.017386],
                [119.402135, 31.99426],
                [119.403259, 31.968764],
                [119.398447, 31.939639],
                [119.394925, 31.893327],
                [119.397729, 31.854206],
                [119.406541, 31.815069],
                [119.409746, 31.7926],
                [119.409345, 31.773871],
                [119.420962, 31.747305],
                [119.427372, 31.730952],
                [119.429375, 31.710848],
                [119.425706, 31.670771],
                [119.41554, 31.603692],
                [119.402013, 31.515235],
                [119.400116, 31.49826],
                [119.393717, 31.481888],
                [119.388265, 31.467131],
                [119.378784, 31.452574],
                [119.366222, 31.437003],
                [119.359822, 31.425016],
                [119.355793, 31.414295],
                [119.349393, 31.404181],
                [119.324269, 31.406001],
                [119.300329, 31.404383],
                [119.286108, 31.408631],
                [119.268568, 31.40944],
                [119.237755, 31.403978],
                [119.214764, 31.408227],
                [119.190155, 31.40762],
                [119.172853, 31.407417],
                [119.158868, 31.403978],
                [119.128055, 31.399123],
                [119.100323, 31.402562],
                [119.07828, 31.40681],
                [119.054642, 31.41518],
                [119.013977, 31.413011],
                [118.993795, 31.412674],
                [118.989568, 31.390042],
                [118.988271, 31.387399],
                [118.983043, 31.383857],
                [118.965172, 31.371138],
                [118.968139, 31.367961],
                [118.965849, 31.366424],
                [118.967207, 31.365152],
                [118.967585, 31.364748],
                [118.967717, 31.36482],
            ];

            var polyline = new AMap.Polyline({
                path: path,
                isOutline: true,
                outlineColor: "#0A6B60",
                borderWeight: 3,
                strokeColor: "#12BFAB",
                strokeOpacity: 1,
                strokeWeight: 4,
                // 折线样式还支持 'dashed'
                strokeStyle: "solid",
                // strokeStyle是dashed时有效
                strokeDasharray: [10, 5],
                lineJoin: "round",
                lineCap: "round",
                zIndex: 50,
            });
            map.add(polyline);
            // 注意如果加setFitView的话前面手动设置的center就会无效了

            // 获取zoom显示元素
            var zoomDisplay = document.getElementById("zoomDisplay");

            // 初始化显示当前zoom级别和透明度
            zoomDisplay.innerHTML = "Zoom: " + map.getZoom();

            // 监听地图缩放事件，实时更新zoom显示
            map.on("zoomend", function () {
                var currentZoom = map.getZoom();
                updateDisplayValues();
            });

            // 也可以在viewchange事件中更新，这样在拖动地图时也会更新
            map.on("viewchange", function () {
                updateDisplayValues();

                var z = map.getZoom();
                var outZ = 20;
            });

            // 更新显示值的函数
            function updateDisplayValues() {
                var currentZoom = map.getZoom();

                zoomDisplay.innerHTML = "Zoom: " + currentZoom;
            }

            var loca = new Loca.Container({
                map,
            });

            var geo = new Loca.GeoJSONSource({
                url: "geo.json",
            });
            // 这里是记录每个坐标点的数值

            // 自定义只显示某地点标签

            // 自定义只显示某地点标签
            var locations = [
                {
                    name: "⭐ABC新能源科技有限公司",
                    lnglat: [118.967756, 31.364896],
                    priority: 1,
                },
                {
                    name: "金属制品有限公司",
                    lnglat: [118.96881, 31.367662],
                    priority: 2,
                },
                {
                    name: "哈雷星激光科技有限公司",
                    lnglat: [118.968861, 31.364325],
                    priority: 2,
                },
                {
                    name: "绿色产业园",
                    lnglat: [118.965717, 31.37062],
                    priority: 3,
                },
                {
                    name: "医疗产业园",
                    lnglat: [118.964171, 31.369735],
                    priority: 3,
                },
                // {
                //     name: "开发区政务服务中心",
                //     lnglat: [118.942484, 31.357135],
                //     priority: 4,
                // },
                {
                    name: "智能科技有限公司",
                    lnglat: [118.964366, 31.365745],
                    priority: 2,
                },

                {
                    name: "辰茂新材料科技有限公司",
                    lnglat: [118.966065, 31.367878],
                    priority: 3,
                },
                {
                    name: "生物科技有限公司",
                    lnglat: [118.965536, 31.367405],
                    priority: 2,
                },

                {
                    name: "盛凯斯新材料有限公司",
                    lnglat: [118.966065, 31.367878],
                    priority: 3,
                },

                // 可以添加更多地点
            ];

            // 存储所有标签的数组
            var textOverlaps = [];
            // 存储所有 createMarker 创建的 marker label
            var markerLabelOverlaps = [];

            // 添加自定义标签
            locations.forEach(function (location) {
                // 创建文本覆盖物，offset设置为正上方
                var textOverlap = new AMap.Text({
                    text: location.name,
                    position: location.lnglat,
                    offset: new AMap.Pixel(-20, -20), // 正上方偏移
                    style: {
                        "background-color": "rgba(0, 0, 0, 0.5)",
                        color: "white",
                        padding: "5px",
                        "border-radius": "3px",
                        "font-size": "14px",
                    },
                });
                textOverlap.setMap(map);
                textOverlaps.push({
                    text: textOverlap,
                    location: location,
                });
            });

            // 计算两点之间的距离（像素）
            function getPixelDistance(point1, point2) {
                var pixel1 = map.lngLatToContainer(point1);
                var pixel2 = map.lngLatToContainer(point2);
                var dx = pixel1.x - pixel2.x;
                var dy = pixel1.y - pixel2.y;
                return Math.sqrt(dx * dx + dy * dy);
            }

            // 定义三个关键坐标点
            var startPoint = path[0]; // 实际发货地（path起点）
            var targetPoint = [119.279197, 32.124126]; // 计划发货地（地图center）

            // var targetPoint = [118.967756, 31.364896]; // 目标收货地（地图center）
            var endPoint = path[path.length - 1]; // 实际收货地（path终点）

            // 通用标记创建函数
            function createMarker(position, name, iconContent) {
                var marker = new AMap.Marker({
                    position: position,
                    content: iconContent,
                    offset: new AMap.Pixel(0, 0),
                    anchor: "bottom-center",
                    label: {
                        content: name,
                        offset: new AMap.Pixel(0, -25), // 正上方偏移
                        style: {
                            color: "#333",
                            fontSize: "16px",
                            backgroundColor: "#fff",
                            padding: "2px 5px",
                            borderRadius: "3px",
                        },
                    },
                });
                // 将 marker 的 label 也加入 markerLabelOverlaps
                markerLabelOverlaps.push({
                    marker: marker,
                    label: marker.getLabel(),
                    position: position,
                    name: name,
                });
                return marker;
            }

            function createMarker2(position, name, iconContent) {
                var marker = new AMap.Marker({
                    position: position,
                    content: iconContent,
                    offset: new AMap.Pixel(0, 0),
                    anchor: "bottom-center",
                    label: {
                        content: name,
                        offset: new AMap.Pixel(0, -25), // 正上方偏移
                        style: {
                            // color: "#333",
                            fontSize: "16px",
                            // backgroundColor: "#fff",
                            padding: "2px 5px",
                            borderRadius: "3px",
                        },
                    },
                });
                // 将 marker 的 label 也加入 markerLabelOverlaps
                markerLabelOverlaps.push({
                    marker: marker,
                    label: marker.getLabel(),
                    position: position,
                    name: name,
                });
                return marker;
            }

            createMarker2(
                endPoint,
                "<b>收货地</b><br/>ABC新能源科技有限公司",
                `<img src="http://localhost:3000/icons/end1.png"  style="width: 30px;">
                `
            ).setMap(map);

            // 添加三个标记
            createMarker(
                startPoint,
                "<b>实际发货地</b><br/>天云科技有限公司",
                `<img src="http://localhost:3000/icons/start2.png" style="width: 30px;">
                `
            ).setMap(map);

            createMarker(
                targetPoint,
                "<b>计划发货地</b><br/>速达科技有限公司",
                `<img src="http://localhost:3000/icons/start1.png" style="width: 30px;">
                `
            ).setMap(map);

            

            // 绘制实际收货地到目标收货地的直线
            var targetLine = new AMap.Polyline({
                path: [startPoint, targetPoint],
                strokeColor: "#FF0000",
                strokeWeight: 4,
                strokeOpacity: 1,
                strokeDasharray: [5, 5],
            });
            map.add(targetLine);

            // 计算并显示距离
            var distance = AMap.GeometryUtil.distance(
                startPoint,
                targetPoint
            ).toFixed(2);
            var distanceText = new AMap.Text({
                text: `距离：${(distance/1000).toFixed(2)}千米`,
                // text: "距离：15.3千米",
                position: [
                    (startPoint[0] + targetPoint[0]) / 2,
                    (startPoint[1] + targetPoint[1]) / 2,
                ],
                offset: new AMap.Pixel(-50, -25), // 正上方偏移，略大于其他标签
                style: {
                    color: "#FF0000",
                    fontSize: "14px",
                    fontWeight: "bold",
                    backgroundColor: "#fff",
                    padding: "2px 8px",
                    borderRadius: "4px",
                },
            });
            map.add(distanceText);

            // 智能标签显示（结合缩放级别和防重叠）
            function updateAdvancedLabels() {
                var currentZoom = map.getZoom();
                var showZoomThreshold = 14; // 显示标签的缩放级别阈值
                var minDistance = 60; // 最小像素距离

                // 只合并 locations 和 marker 标签
                var allOverlaps = [];
                textOverlaps.forEach(function (item) {
                    allOverlaps.push({
                        type: "location",
                        text: item.text,
                        position: item.location.lnglat,
                        priority: item.location.priority || 1,
                    });
                });
                markerLabelOverlaps.forEach(function (item, idx) {
                    allOverlaps.push({
                        type: "marker",
                        text:
                            item.marker.getLabel && item.marker.getLabel()
                                ? item.marker.getLabel()
                                : null,
                        position: item.position,
                        priority: 2,
                    });
                });

                // 距离标签单独控制显示
                if (currentZoom >= 10) {
                    if (distanceText && distanceText.show) distanceText.show();
                } else {
                    if (distanceText && distanceText.hide) distanceText.hide();
                }

                // 如果缩放级别小于阈值，隐藏所有标签
                if (currentZoom < showZoomThreshold) {
                    allOverlaps.forEach(function (item) {
                        if (item.text && item.text.hide) item.text.hide();
                    });
                    return;
                }

                // 根据缩放级别调整最小距离
                var zoomFactor = Math.max(
                    1,
                    (currentZoom - showZoomThreshold) * 0.5
                );
                var dynamicMinDistance = minDistance / zoomFactor;

                // 重置所有标签可见性
                allOverlaps.forEach(function (item) {
                    if (item.text && item.text.show) item.text.show();
                });

                // 按优先级排序
                var sortedOverlaps = allOverlaps.slice().sort(function (a, b) {
                    return a.priority - b.priority;
                });

                // 检查并处理重叠
                for (var i = 0; i < sortedOverlaps.length; i++) {
                    for (var j = i + 1; j < sortedOverlaps.length; j++) {
                        var distance = getPixelDistance(
                            sortedOverlaps[i].position,
                            sortedOverlaps[j].position
                        );
                        if (distance < dynamicMinDistance) {
                            if (
                                sortedOverlaps[j].priority <=
                                sortedOverlaps[i].priority
                            ) {
                                if (
                                    sortedOverlaps[j].text &&
                                    sortedOverlaps[j].text.hide
                                ) {
                                    sortedOverlaps[j].text.hide();
                                }
                            }
                        }
                    }
                }
            }

            // 监听缩放和拖动事件
            map.on("zoomend", updateAdvancedLabels);
            map.on("viewchange", updateAdvancedLabels);

            // 初始化时执行一次
            updateAdvancedLabels();

            // 创建纯文本标记
            var text = new AMap.Text({
                text: "纯文本标记",
                anchor: "center", // 设置文本标记锚点
                draggable: true,
                cursor: "pointer",
                angle: 0,
                visible: false,
                offset: [0, 0],
                style: {
                    padding: ".45rem 0.15rem",
                    "margin-bottom": "1rem",
                    "border-radius": ".25rem",
                    "background-color": "rgba(0,0,0,0.5)",
                    width: "15rem",
                    "border-width": 0,
                    "box-shadow": "0 2px 6px 0 rgba(255, 255, 255, .3)",
                    "text-align": "center",
                    "font-size": "15px",
                    color: "#fff",
                },
            });
            text.setMap(map);
            
            map.setFitView();
        </script>
    </body>
</html>
